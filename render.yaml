services:
  - type: web
    name: tontine-digital-api
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tontine-digital-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: DB_POOL_MAX
        value: "10"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: ""
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: ADMIN_BOOTSTRAP_NAME
        value: Administrateur principal
      - key: ADMIN_BOOTSTRAP_PHONE
        sync: false
      - key: WAVE_API_KEY
        sync: false
      - key: WAVE_WEBHOOK_SECRET
        sync: false
      - key: WAVE_API_BASE_URL
        sync: false
      - key: ORANGE_MONEY_MERCHANT_ID
        sync: false
      - key: MTN_MOMO_MERCHANT_ID
        sync: false
      - key: MOOV_MONEY_MERCHANT_ID
        sync: false

databases:
  - name: tontine-digital-db
    plan: free
    region: frankfurt
