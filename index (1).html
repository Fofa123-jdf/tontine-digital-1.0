<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tontine Digital 1.0 — Membre</title><style>body{font-family:Arial;background:#eef7f4;margin:0;color:#17352d}.wrap{max-width:520px;margin:auto;padding:14px}.card{background:#fff;padding:16px;border-radius:15px;margin:10px 0;box-shadow:0 3px 14px #0001}input,button,select{width:100%;box-sizing:border-box;padding:11px;margin:5px 0;border-radius:9px;border:1px solid #cbded6}button{background:#006b4f;color:#fff;border:0}.hidden{display:none}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #edf1ef}.ok{color:#08734d}.warn{color:#a66b00}</style></head><body><div class="wrap"><h1>🌿 Tontine Digital 1.0</h1><section id="auth"><div class="card"><h2>Créer un compte</h2><input id="rn" placeholder="Nom complet"><input id="rp" placeholder="Téléphone"><input id="re" placeholder="Email (facultatif)"><input id="rpass" type="password" placeholder="Mot de passe (6 caractères minimum)"><input id="rr" placeholder="Code parrain (facultatif)"><button onclick="register()">Créer mon compte</button><p id="rm"></p></div><div class="card"><h2>Connexion</h2><input id="li" placeholder="Téléphone ou email"><input id="lp" type="password" placeholder="Mot de passe"><button onclick="login()">Se connecter</button><p id="lm"></p></div></section><section id="app" class="hidden"><div class="card"><button onclick="logout()">Déconnexion</button><b id="name"></b><p id="ref"></p></div><div class="card"><h2>Mes tontines</h2><div id="ts"></div></div><div class="card"><h2>Payer une cotisation</h2><select id="tontine"></select><input id="amount" type="number" value="500"><select id="provider"><option>Orange Money</option><option>MTN Money</option><option>Wave</option><option>Moov Money</option></select><button onclick="preview()">Calculer le total</button><div id="calc"></div><button onclick="pay()">Créer le paiement de test</button><p id="pm"></p></div><div class="card"><h2>Historique</h2><div id="hist"></div></div></section></div><script>let token=localStorage.tdMemberToken,user;const $=x=>document.getElementById(x);async function api(path,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};let r=await fetch('/api'+path,opt);let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erreur');return d}async function login(){try{let d=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier:$('li').value,password:$('lp').value})}).then(r=>r.json());if(!d.token)throw Error(d.error||'Connexion impossible');if(d.user.role!=='member')throw Error('Utilisez l’espace administration');token=d.token;localStorage.tdMemberToken=token;await open()}catch(e){$('lm').textContent=e.message}}async function register(){try{let d=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fullName:$('rn').value,phone:$('rp').value,email:$('re').value||null,password:$('rpass').value,referralCode:$('rr').value||null})}).then(r=>r.json());if(!d.token)throw Error(d.error||'Inscription impossible');token=d.token;localStorage.tdMemberToken=token;await open()}catch(e){$('rm').textContent=e.message}}async function open(){user=await api('/me');$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('name').textContent=user.full_name;$('ref').textContent='Code parrain : '+user.referral_code;let ts=await api('/tontines');$('ts').innerHTML=ts.length?ts.map(t=>'<div class="row"><span>'+t.name+'</span><b>'+t.contribution_amount+' FCFA</b></div>').join(''):'<p>Aucune tontine active. L’administration doit en créer une.</p>';$('tontine').innerHTML=ts.map(t=>'<option value="'+t.id+'">'+t.name+' — '+t.contribution_amount+' FCFA</option>').join('');await history()}async function preview(){try{let d=await api('/payments/preview',{method:'POST',body:JSON.stringify({tontineId:$('tontine').value,amount:Number($('amount').value)})});$('calc').innerHTML='<div class="row"><span>Cotisation</span><b>'+d.baseAmount+' FCFA</b></div><div class="row"><span>Commission administration</span><b>'+d.adminCommission+' FCFA</b></div><div class="row"><span>Commission parrain</span><b>'+d.sponsorCommission+' FCFA</b></div><div class="row"><span>Total</span><b>'+d.totalAmount+' FCFA</b></div>'}catch(e){$('calc').textContent=e.message}}async function pay(){try{let d=await api('/payments',{method:'POST',body:JSON.stringify({tontineId:$('tontine').value,amount:Number($('amount').value),provider:$('provider').value})});$('pm').textContent='Paiement créé : '+d.payment.total_amount+' FCFA, statut '+d.payment.status+'. L’administration devra le confirmer pour le créditer.';await history()}catch(e){$('pm').textContent=e.message}}async function history(){let r=await api('/payments');$('hist').innerHTML=r.length?r.map(p=>'<div class="row"><span>'+p.created_at+'</span><b>'+p.total_amount+' FCFA — '+p.status+'</b></div>').join(''):'Aucun paiement.'}function logout(){localStorage.removeItem('tdMemberToken');location.reload()}if(token)open().catch(logout)</script></body></html>
