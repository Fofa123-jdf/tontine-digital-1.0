<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tontine Digital — Membre</title>
<style>body{font-family:Arial,sans-serif;background:#eef7f4;margin:0;color:#17352d}.wrap{max-width:560px;margin:auto;padding:14px}.card{background:#fff;padding:16px;border-radius:15px;margin:10px 0;box-shadow:0 3px 14px #0001}input,button,select{width:100%;box-sizing:border-box;padding:11px;margin:5px 0;border-radius:9px;border:1px solid #cbded6}button{background:#08734d;color:#fff;border:0;font-weight:700}.hidden{display:none}.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #edf1ef}.msg{min-height:20px}.ok{color:#08734d}.warn{color:#9a6500}</style></head>
<body><div class="wrap"><h1>🌿 Tontine Digital</h1>
<section id="auth">
<div class="card"><h2>Créer un compte</h2><input id="rn" placeholder="Nom complet"><input id="rp" placeholder="Téléphone"><input id="re" placeholder="Email (facultatif)"><input id="rpass" type="password" placeholder="Mot de passe (6 caractères minimum)"><input id="rr" placeholder="Code parrain (facultatif)"><button onclick="register()">Créer mon compte</button><p id="rm" class="msg"></p></div>
<div class="card"><h2>Connexion</h2><input id="li" placeholder="Téléphone ou email"><input id="lp" type="password" placeholder="Mot de passe"><button onclick="login()">Se connecter</button><p id="lm" class="msg"></p></div></section>
<section id="app" class="hidden"><div class="card"><button onclick="logout()">Déconnexion</button><h2 id="name"></h2><p>Code parrain : <b id="ref"></b></p></div>
<div class="card"><h2>Mes tontines</h2><div id="ts"></div></div>
<div class="card"><h2>Adhérer à une tontine</h2><select id="joinT"></select><button onclick="join()">Rejoindre</button><p id="jm" class="msg"></p></div>
<div class="card"><h2>Payer une cotisation</h2><select id="payT"></select><input id="amount" type="number" min="1" placeholder="Montant"><select id="provider"><option value="ORANGE_MONEY">Orange Money</option><option value="MTN_MONEY">MTN Money</option><option value="WAVE">Wave</option><option value="MOOV_MONEY">Moov Money</option><option value="MANUAL_TEST">Test manuel</option></select><button onclick="preview()">Calculer le total</button><div id="calc"></div><button onclick="pay()">Créer le paiement</button><p id="pm" class="msg"></p></div>
<div class="card"><h2>Historique</h2><div id="hist"></div></div></section></div>
<script>
let token=localStorage.tdMemberToken;
const $=id=>document.getElementById(id);
async function req(path,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json',Authorization:'Bearer '+token};const r=await fetch('/api'+path,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erreur');return d}
async function login(){try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier:$('li').value,password:$('lp').value})});const d=await r.json();if(!r.ok)throw Error(d.error);if(d.user.role!=='member')throw Error('Utilisez l’espace Administration');token=d.token;localStorage.tdMemberToken=token;await open()}catch(e){$('lm').textContent=e.message}}
async function register(){try{const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fullName:$('rn').value,phone:$('rp').value,email:$('re').value||null,password:$('rpass').value,referralCode:$('rr').value||null})});const d=await r.json();if(!r.ok)throw Error(d.error);token=d.token;localStorage.tdMemberToken=token;await open()}catch(e){$('rm').textContent=e.message}}
async function open(){const u=await req('/me');if(u.role!=='member')throw Error('Compte administrateur : utilisez /admin');$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('name').textContent=u.full_name;$('ref').textContent=u.referral_code;await loadTontines();await history()}
async function loadTontines(){const ts=await req('/tontines');$('ts').innerHTML=ts.length?ts.map(t=>`<div class="row"><span>${esc(t.name)}</span><b>${t.contribution_amount} FCFA</b></div>`).join(''):'<p>Aucune tontine active.</p>';$('joinT').innerHTML=ts.map(t=>`<option value="${t.id}">${esc(t.name)} — ${t.contribution_amount} FCFA</option>`).join('');$('payT').innerHTML=$('joinT').innerHTML;$('amount').value=ts[0]?.contribution_amount||''}
async function join(){try{await req('/tontines/'+$('joinT').value+'/join',{method:'POST'});$('jm').textContent='Adhésion enregistrée.'}catch(e){$('jm').textContent=e.message}}
async function preview(){try{const d=await req('/payments/preview',{method:'POST',body:JSON.stringify({tontineId:$('payT').value,amount:Number($('amount').value)})});$('calc').innerHTML=`<div class=row><span>Cotisation</span><b>${d.baseAmount} FCFA</b></div><div class=row><span>Commission admin</span><b>${d.adminCommission} FCFA</b></div><div class=row><span>Commission parrain</span><b>${d.sponsorCommission} FCFA</b></div><div class=row><span>Total à payer</span><b>${d.totalAmount} FCFA</b></div>`}catch(e){$('calc').textContent=e.message}}
async function pay(){try{const key=crypto.randomUUID?crypto.randomUUID():String(Date.now());const d=await req('/payments',{method:'POST',headers:{'Idempotency-Key':key},body:JSON.stringify({tontineId:$('payT').value,amount:Number($('amount').value),provider:$('provider').value,idempotencyKey:key})});$('pm').textContent=`Paiement ${d.payment.status} : ${d.payment.total_amount} FCFA. En test, l’administration doit le confirmer.`;await history()}catch(e){$('pm').textContent=e.message}}
async function history(){const r=await req('/payments');$('hist').innerHTML=r.length?r.map(p=>`<div class=row><span>${new Date(p.created_at).toLocaleString('fr-FR')}</span><b>${p.total_amount} FCFA — ${p.status}</b></div>`).join(''):'Aucun paiement.'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function logout(){localStorage.removeItem('tdMemberToken');location.reload()}
if(token)open().catch(()=>logout())
</script></body></html>
