<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tontine Digital — Administration</title>
<style>body{font-family:Arial,sans-serif;background:#f4f7f6;color:#17352d;margin:0}.wrap{max-width:1150px;margin:auto;padding:16px}.card{background:#fff;padding:16px;border-radius:14px;margin:12px 0;box-shadow:0 3px 15px #0001}input,button,select{padding:10px;border-radius:9px;border:1px solid #cbded6;margin:4px}button{background:#006b4f;color:#fff;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.stat{padding:14px;background:#edf7f3;border-radius:12px}.hidden{display:none}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #e5eeea;text-align:left;font-size:12px}.scroll{overflow:auto}.danger{background:#a33}.muted{color:#687b74}.tabs button{margin-right:4px}</style></head>
<body><div class="wrap"><h1>🌿 Tontine Digital — Administration</h1>
<section id="login" class="card"><h2>Connexion administrateur</h2><input id="id" placeholder="Email ou téléphone"><input id="pw" type="password" placeholder="Mot de passe"><button onclick="login()">Se connecter</button><p id="msg"></p></section>
<section id="app" class="hidden"><div class="card"><button onclick="logout()">Déconnexion</button> <b id="who"></b></div><div class="grid" id="stats"></div>
<div class="card"><h2>Créer une tontine</h2><input id="tn" placeholder="Nom"><input id="ta" type="number" placeholder="Cotisation FCFA"><select id="tf"><option value="monthly">Mensuelle</option><option value="weekly">Hebdomadaire</option></select><button onclick="createTontine()">Créer</button></div>
<div class="card"><h2>Comptes de collecte</h2><input id="caLabel" placeholder="Libellé"><select id="caProvider"><option value="ORANGE_MONEY">Orange Money</option><option value="MTN_MONEY">MTN Money</option><option value="WAVE">Wave</option><option value="MOOV_MONEY">Moov Money</option><option value="BANK">Banque</option></select><input id="caId" placeholder="Numéro / identifiant"><button onclick="addAccount()">Ajouter</button><div id="accounts"></div></div>
<div class="card"><h2>Cotisations</h2><button onclick="loadPayments()">Actualiser</button><div class="scroll" id="payments"></div></div>
<div class="card"><h2>Ordres bénéficiaires</h2><button onclick="loadBeneficiaries()">Actualiser</button><div class="scroll" id="beneficiaries"></div></div>
<div class="card"><h2>Journal financier</h2><button onclick="loadLedger()">Actualiser</button><div class="scroll" id="ledger"></div></div>
<div class="card"><h2>Membres</h2><div class="scroll" id="users"></div></div><div class="card"><h2>Tontines</h2><div class="scroll" id="tontines"></div></div>
</section></div>
<script>
let token=localStorage.tdAdminToken;const $=id=>document.getElementById(id);
async function req(path,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};const r=await fetch('/api'+path,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erreur');return d}
async function login(){try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier:$('id').value,password:$('pw').value})});const d=await r.json();if(!r.ok)throw Error(d.error);if(!['admin','super_admin'].includes(d.user.role))throw Error('Ce compte n’est pas administrateur');token=d.token;localStorage.tdAdminToken=token;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=d.user.full_name+' — '+d.user.role;await refresh()}catch(e){$('msg').textContent=e.message}}
async function refresh(){const o=await req('/admin/overview');$('stats').innerHTML=`<div class=stat>Membres<br><b>${o.members}</b></div><div class=stat>Tontines<br><b>${o.tontines}</b></div><div class=stat>Paiements confirmés<br><b>${o.confirmedPayments.count}</b></div><div class=stat>Total confirmé<br><b>${o.confirmedPayments.total} FCFA</b></div><div class=stat>Commission admin<br><b>${o.adminCommission} FCFA</b></div><div class=stat>Ordres en attente<br><b>${o.pendingBeneficiaries}</b></div>`;await Promise.all([loadUsers(),loadTontines(),loadPayments(),loadLedger(),loadAccounts(),loadBeneficiaries()])}
function table(rows,cols){if(!rows.length)return '<p>Aucune donnée.</p>';return '<table><tr>'+cols.map(c=>'<th>'+c[1]+'</th>').join('')+'</tr>'+rows.map(x=>'<tr>'+cols.map(c=>'<td>'+esc(x[c[0]])+'</td>').join('')+'</tr>').join('')+'</table>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadUsers(){const r=await req('/admin/users');$('users').innerHTML=table(r,[['full_name','Nom'],['phone','Téléphone'],['email','Email'],['role','Rôle'],['referral_code','Parrain'],['created_at','Créé le']])}
async function loadTontines(){const r=await req('/admin/tontines');$('tontines').innerHTML=table(r,[['name','Nom'],['contribution_amount','Cotisation'],['frequency','Fréquence'],['members','Membres'],['active','Active']])}
async function loadPayments(){const r=await req('/admin/payments');$('payments').innerHTML=table(r,[['full_name','Membre'],['phone','Téléphone'],['tontine_name','Tontine'],['base_amount','Base'],['admin_commission','Admin'],['sponsor_commission','Parrain'],['total_amount','Total'],['status','Statut'],['provider','Prestataire'],['provider_reference','Référence'],['created_at','Date']])}
async function loadLedger(){const r=await req('/admin/ledger');$('ledger').innerHTML=table(r,[['nature','Nature'],['amount','Montant'],['reference','Référence'],['full_name','Membre'],['tontine_name','Tontine'],['created_at','Date']])}
async function loadAccounts(){const r=await req('/admin/collection-accounts');$('accounts').innerHTML=table(r,[['provider','Prestataire'],['label','Libellé'],['account_identifier','Compte'],['active','Actif']])}
async function loadBeneficiaries(){const r=await req('/admin/beneficiary-payments');$('beneficiaries').innerHTML=table(r,[['full_name','Bénéficiaire'],['phone','Téléphone'],['tontine_name','Tontine'],['amount','Montant'],['due_date','Échéance'],['provider','Prestataire'],['source_account','Compte source'],['status','Statut'],['payment_reference','Référence']])}
async function createTontine(){try{await req('/admin/tontines',{method:'POST',body:JSON.stringify({name:$('tn').value,contributionAmount:Number($('ta').value),frequency:$('tf').value})});$('tn').value='';$('ta').value='';await refresh()}catch(e){alert(e.message)}}
async function addAccount(){try{await req('/admin/collection-accounts',{method:'POST',body:JSON.stringify({provider:$('caProvider').value,label:$('caLabel').value,accountIdentifier:$('caId').value})});$('caLabel').value='';$('caId').value='';await loadAccounts()}catch(e){alert(e.message)}}
function logout(){localStorage.removeItem('tdAdminToken');location.reload()}
if(token){$('login').classList.add('hidden');$('app').classList.remove('hidden');refresh().catch(()=>logout())}
</script></body></html>
