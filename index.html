<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tontine Digital 1.0 — Administration</title><style>body{font-family:Arial;margin:0;background:#f4f7f6;color:#17352d}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#fff;padding:18px;border-radius:14px;margin:12px 0;box-shadow:0 3px 15px #0001}input,button,select{padding:10px;border-radius:9px;border:1px solid #cbded6;margin:4px}button{background:#006b4f;color:white;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.stat{padding:15px;background:#edf7f3;border-radius:12px}.hidden{display:none}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #e5eeea;text-align:left;font-size:13px}.danger{background:#a33}.muted{color:#687b74}</style></head><body><div class="wrap"><h1>🌿 Tontine Digital 1.0</h1><p class="muted">Espace Administration — accès réservé aux rôles admin/super_admin.</p><section id="login" class="card"><h2>Connexion administrateur</h2><input id="id" placeholder="Email ou téléphone"><input id="pw" type="password" placeholder="Mot de passe"><button onclick="login()">Se connecter</button><p id="msg"></p></section><section id="app" class="hidden"><div class="card"><button onclick="logout()">Déconnexion</button> <span id="who"></span></div><div class="grid" id="stats"></div><div class="card"><h2>Créer une tontine</h2><input id="tn" placeholder="Nom de la tontine"><input id="ta" type="number" placeholder="Cotisation FCFA"><select id="tf"><option value="monthly">Mensuelle</option><option value="weekly">Hebdomadaire</option></select><button onclick="createTontine()">Créer</button></div><div class="card"><h2>Membres</h2><button onclick="loadUsers()">Actualiser</button><div id="users"></div></div><div class="card"><h2>Tontines</h2><div id="tontines"></div></div><div class="card"><h2>Cotisations / paiements</h2><button onclick="loadPayments()">Actualiser</button><div id="payments"></div></div><div class="card"><h2>Journal financier</h2><button onclick="loadLedger()">Actualiser</button><div id="ledger"></div></div></section></div><script>let token=localStorage.tdAdminToken;const $=x=>document.getElementById(x);async function api(path,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};let r=await fetch('/api'+path,opt);let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erreur');return d}async function login(){try{let d=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier:$('id').value,password:$('pw').value})}).then(r=>r.json());if(!d.token)throw Error(d.error||'Connexion impossible');if(!['admin','super_admin'].includes(d.user.role))throw Error('Ce compte n’est pas administrateur');token=d.token;localStorage.tdAdminToken=token;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=d.user.full_name+' — '+d.user.role;await refresh()}catch(e){$('msg').textContent=e.message}}async function refresh(){try{let o=await api('/admin/overview');$('stats').innerHTML='<div class="stat"><b>Membres</b><br>'+o.members+'</div><div class="stat"><b>Tontines</b><br>'+o.tontines+'</div><div class="stat"><b>Paiements confirmés</b><br>'+o.confirmedPayments.count+'</div><div class="stat"><b>Total confirmé</b><br>'+o.confirmedPayments.total+' FCFA</div><div class="stat"><b>Commission admin</b><br>'+o.adminCommission+' FCFA</div><div class="stat"><b>Bénéficiaires en attente</b><br>'+o.pendingBeneficiaries+'</div>';await Promise.all([loadUsers(),loadTontines(),loadPayments(),loadLedger()])}catch(e){alert(e.message)}}function table(rows,cols){if(!rows.length)return '<p>Aucune donnée.</p>';return '<table><tr>'+cols.map(c=>'<th>'+c[1]+'</th>').join('')+'</tr>'+rows.map(x=>'<tr>'+cols.map(c=>'<td>'+((x[c[0]]??'')+'').replaceAll('<','&lt;')+'</td>').join('')+'</tr>').join('')+'</table>'}async function loadUsers(){let r=await api('/admin/users');$('users').innerHTML=table(r,[['full_name','Nom'],['phone','Téléphone'],['email','Email'],['role','Rôle'],['referral_code','Parrain'],['created_at','Créé le']])}async function loadTontines(){let r=await api('/admin/tontines');$('tontines').innerHTML=table(r,[['name','Nom'],['contribution_amount','Cotisation'],['frequency','Fréquence'],['members','Membres'],['active','Active']])}async function loadPayments(){let r=await api('/admin/payments');$('payments').innerHTML=table(r,[['full_name','Membre'],['phone','Téléphone'],['tontine_name','Tontine'],['base_amount','Base'],['admin_commission','Admin'],['sponsor_commission','Parrain'],['total_amount','Total'],['status','Statut'],['provider','Prestataire'],['created_at','Date']])}async function loadLedger(){let r=await api('/admin/ledger');$('ledger').innerHTML=table(r,[['nature','Nature'],['amount','Montant'],['reference','Référence'],['full_name','Membre'],['tontine_name','Tontine'],['created_at','Date']])}async function createTontine(){try{await api('/admin/tontines',{method:'POST',body:JSON.stringify({name:$('tn').value,contributionAmount:Number($('ta').value),frequency:$('tf').value})});$('tn').value='';$('ta').value='';await refresh()}catch(e){alert(e.message)}}function logout(){localStorage.removeItem('tdAdminToken');location.reload()}if(token){$('login').classList.add('hidden');$('app').classList.remove('hidden');refresh().catch(()=>logout())}</script></body></html>
